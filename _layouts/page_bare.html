---
layout: default
---

<!-- Page Header -->
{% if page.background %}
<header class="masthead bg-image parallax"
  style="background-position: 50% 0px; background-image: url('{{ page.background | prepend: site.baseurl | replace: '//', '/' }}')">
  {% else %}
  <header class="masthead">
    {% endif %}
    <div class="mask" style="background-color: rgba(0, 0, 0, 0.4);">
      <div class="d-flex justify-content-center align-items-center h-100">
        <div class="page-heading">
          <h1>{{ page.title }}</h1>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="row">
      <div class="col-12 mx-auto">

        {{ content }}

      </div>
    </div>
  </div>

  {% if page.background %}
  <header class="masthead bg-image parallax" style="background-position: 50% 0px; background-image: url('{{ "img/bg-contact.jpg" | prepend: site.baseurl | replace: '//' , '/' }}')">
    {% else %}
    <header class="masthead">
      {% endif %}
      <div class="mask" style="background-color: rgba(0, 0, 0, 0.4);">
        <div class="d-flex justify-content-center align-items-center h-100">
          <div class="col-md-8 mx-auto py-5" id="contact">
            <p class="text-light">Want to get in touch? Fill out the form below to send me a message and I will get
              back to
              you as soon as possible!
            </p>
            {% include contact.html %}
          </div>
        </div>
      </div>
    </header>
