  facebook:  mudcreekforest
  instagram: mudcreekforest

# Add your google-analytics ID here to activate google analytics
google_analytics:   G-6K0FGM8G6X

# Build settings
markdown:           kramdown
paginate:           5
paginate_path:      "/posts/page:num/"
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site
  - jekyll-gallery-generator

gallery:
  dir: services # Path to the gallery
  symlink: false            # false: copy images into _site. true: create symbolic links (saves disk space)
  title: "Our Services"    # Title for gallery index page
  title_prefix: "Our Services: "  # Title prefix for gallery pages. Gallery title = title_prefix + gallery_name
  sort_field: "date_time"   # How to sort galleries on the index page.
                            # Possible values are: title, date_time, best_image
  thumbnail_size:
    x: 400                  # max width of thumbnails (in pixels)
    y: 400                  # max height of thumbnails (in pixels)
  # The following options are for individual galleries.
  galleries:
    landscaping:
      best_image: default.jpg
      info:
        desc: Turn your yard into an outdoor space you actually use. From flagstone patios to fire pits and flower beds, we design and build hardscaping that adds lasting value to your property — built to handle the Nova Scotia seasons.
        background: /services/landscaping/20240723_121954.jpg
        features:
          - "Stone patios & fire pits"
          - "Flower beds & ground cover"
          - "Retaining walls & hardscaping"
    lawn-mowing:
      best_image: default.jpg
      info:
        desc: A well-kept lawn makes a strong first impression. We show up on schedule, cut clean, and leave your property looking sharp — so you can enjoy your weekends instead of spending them behind a mower.
        background: /services/lawn-mowing/20240614_180833.jpg
        features:
          - "Zero-turn mowing & striping"
          - "Edging & whipper snipping"
          - "Spring & fall cleanup"
    property-maintenance:
      best_image: default.jpg
      info:
        desc: Keep your property safe, tidy, and manageable year-round. Whether it's overgrown trees, accumulated debris, or a structure that needs to come down, we handle the heavy work so you don't have to.
        background: /services/property-maintenance/20240611_172253.jpg
        features:
          - "Tree cutting & trimming"
          - "Light demolition & debris removal"
          - "Planting, fertilizing & seeding"
