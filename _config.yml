title:              Cumberland Shingles
email:              info@cumberlandshingles.ca
address:            "Northport, NS"
phone_number:       (506)-540-0207
description:        Locally owned and operated shingle roofing out of Northport, Nova Scotia — serving Cumberland County and surrounding areas.
author:             Cumberland Shingles
baseurl:            ""
url:                "https://www.cumberlandshingles.ca"

pin_location: "https://maps.app.goo.gl/nx8BK1oADZcFpxBW8"
social_profiles:
  facebook:  cumberlandshingles
  instagram: cumberlandshingles

# Add your google-analytics ID here to activate google analytics
google_analytics:   G-6K0FGM8G6X

# Build settings
markdown:           kramdown
paginate:           5
paginate_path:      "/posts/page:num/"
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site
  - jekyll-gallery-generator

gallery:
  dir: services # Path to the gallery
  symlink: false            # false: copy images into _site. true: create symbolic links (saves disk space)
  title: "Our Services"    # Title for gallery index page
  title_prefix: "Our Services: "  # Title prefix for gallery pages. Gallery title = title_prefix + gallery_name
  sort_field: "date_time"   # How to sort galleries on the index page.
                            # Possible values are: title, date_time, best_image
  thumbnail_size:
    x: 400                  # max width of thumbnails (in pixels)
    y: 400                  # max height of thumbnails (in pixels)
  # The following options are for individual galleries.
  galleries:
    shingle-installation:
      best_image: default.jpg
      info:
        desc: A new shingle roof is the best investment you can make in your home. We install quality asphalt shingles built to handle Nova Scotia's harshest seasons — done right the first time, backed by our workmanship.
        background: /services/shingle-installation/default.jpg
        features:
          - "Full roof replacements"
          - "Asphalt shingle installation"
          - "Drip edge & ice & water shield"
    roof-repairs:
      best_image: default.jpg
      info:
        desc: Leaks, missing shingles, damaged flashing — we find the problem and fix it properly. Fast turnaround so small issues don't turn into expensive ones.
        background: /services/roof-repairs/default.jpg
        features:
          - "Leak detection & repair"
          - "Missing or damaged shingles"
          - "Flashing & vent repair"
    roof-inspection:
      best_image: default.jpg
      info:
        desc: Not sure what shape your roof is in? We offer thorough inspections and honest assessments so you know exactly what you're dealing with — no upsells, no pressure.
        background: /services/roof-inspection/default.jpg
        features:
          - "Full roof condition report"
          - "Pre-sale & insurance inspections"
          - "Free estimates on all work"
